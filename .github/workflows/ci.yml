name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vyper==0.4.3
      - run: forge build
      - run: forge test

  halmos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vyper==0.4.3 halmos
      - name: symbolic proofs
        env:
          HALMOS_ALLOW_DOWNLOAD: "1"
        # halmos performs its own AST-bearing build; do not forge build first.
        # CI runs the 8 tractable lemmas on the bundled default solver. The
        # three nonlinear 256-bit floor-division queries (redeemConservation,
        # pValueAboveStrike, payoutMonotone_aboveStrike) are solver-intractable
        # in CI time — run them locally with:
        #   forge clean && halmos --contract HalmosVerification \
        #     --function check_redeemConservation --solver bitwuzla \
        #     --solver-timeout-assertion 0
        # bitwuzla closes all 8 lemmas in single-digit seconds; the bundled
        # yices is too slow (times out on payoutMonotone_acrossStrike). The
        # 120s/assertion cap is generous headroom, not a real bound.
        run: |
          for fn in check_payoutBounded check_splitMergeExact \
                    check_splitFullyCollateralized \
                    check_erc20TransferPreservesSupply check_onlyMinterMints \
                    check_pValueAtOrBelowStrike check_payoutMonotone_belowStrike \
                    check_payoutMonotone_acrossStrike; do
            halmos --contract HalmosVerification --function "$fn" \
              --solver bitwuzla --solver-timeout-assertion 120000 || exit 1
          done
