name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vyper==0.4.3
      - run: forge build
      - run: forge test

  halmos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install vyper==0.4.3 halmos
      - name: symbolic proofs
        env:
          HALMOS_ALLOW_DOWNLOAD: "1"
        # halmos performs its own AST-bearing build; do not forge build first.
        # CI runs the tractable theorems; the three nonlinear-division proofs
        # (conservation, pValueNeverExceedsStrike, payoutMonotone) are
        # long-running SMT queries — run them locally with
        #   --solver bitwuzla --solver-timeout-assertion 0
        run: |
          for fn in check_payoutBounded check_splitMergeExact \
                    check_splitFullyCollateralized \
                    check_erc20TransferPreservesSupply check_onlyMinterMints; do
            halmos --contract HalmosVerification --function "$fn" --solver bitwuzla || exit 1
          done
