[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
# via_ir: the SignedQuoteFiller fork test ABI-encodes an 8-field Quote struct for the
# desk's external calls, which overflows the legacy codegen stack ("stack too deep").
# Only affects Solidity test compilation — the core protocol is Vyper, untouched.
via_ir = true
fs_permissions = [{ access = "read", path = "./out" }]

# Vyper is auto-detected on PATH (install with `pip install vyper==0.4.3`).
# Do NOT hardcode an absolute `[vyper] path` here — it breaks CI and every
# other clone. Ensure the dir holding the `vyper` executable is on PATH.

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
